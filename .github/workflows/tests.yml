name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # espelha o compose.yaml: a suíte roda contra MySQL, não SQLite, para que
    # os testes de concorrência exerçam travas reais de linha
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # o Dotenv do Laravel não sobrescreve variáveis já presentes no ambiente,
      # então isto vence o DB_HOST=mysql do .env.example
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # equivalente ao create-testing-database.sh que o Sail monta no container
      - name: Create testing database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -ppassword \
            -e "CREATE DATABASE IF NOT EXISTS testing;
                GRANT ALL ON testing.* TO 'sail'@'%';
                FLUSH PRIVILEGES;"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
